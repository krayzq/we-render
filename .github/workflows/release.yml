name: Draft release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check tag
        run: |
          python - <<'PY'
          import os
          from we_render import __version__
          assert os.environ['GITHUB_REF_NAME'] == 'v' + __version__, 'Tag/version mismatch'
          PY
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gcc libx11-dev libgl-dev xvfb xauth
          python -m pip install pytest pexpect PyYAML
      - name: Verify and package
        run: |
          xvfb-run -a python -m pytest -q
          python tools/build.py
          python -I -S dist/we-render.pyz --version
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --draft --prerelease \
            --title "WE Render $GITHUB_REF_NAME" --generate-notes
